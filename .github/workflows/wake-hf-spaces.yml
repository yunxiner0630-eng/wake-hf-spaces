name: Wake Hugging Face Spaces

on:
  schedule:
    - cron: "0 1,7,13 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl ping all spaces
        run: |
          set -e
          URLS=(
            "https://huggingface.co/spaces/<user>/L01"
            "https://huggingface.co/spaces/<user>/L02"
            # ...
          )

          for u in "${URLS[@]}"; do
            echo "Pinging $u"
            code=$(curl -s -o /dev/null -w "%{http_code}" "$u")
            echo "HTTP $code"
            if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
              sleep 10
              code2=$(curl -s -o /dev/null -w "%{http_code}" "$u")
              echo "Retry HTTP $code2"
            fi
          done
